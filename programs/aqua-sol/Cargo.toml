[package]
name = "aqua-sol"
version = "0.1.0"
description = "AquaSol - Water as RWA"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "aqua_sol"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = []
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"